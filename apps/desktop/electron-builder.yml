appId: com.zhusi.inkhub
productName: 墨枢
artifactName: "InkHub-${version}-${os}-${arch}-test.${ext}"

directories:
  output: release
  buildResources: build

# electron-builder 的旧版 NSIS 工具包只包含 Intel macOS 编译器，
# 在 Apple Silicon 上会以系统错误 -86 失败。1.2.1 提供原生
# darwin-arm64 makensis，同时保持 Windows 安装器格式不变。
toolsets:
  nsis: "1.2.1"

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  - from: ../../node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: ../../node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html

asar: true
beforeBuild: ./scripts/electron-builder-before-build.cjs
afterPack: ./scripts/electron-builder-after-pack.cjs

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  notarize: false

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 墨枢
  deleteAppDataOnUninstall: false
