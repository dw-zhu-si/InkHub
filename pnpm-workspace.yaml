packages:
  - apps/*
  - packages/*

overrides:
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  fast-uri: 3.1.9
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  'undici@6': 6.29.1
  'undici@7': 7.30.1
  tar: 7.5.21
  source-map-js: 1.2.2
  'zod@4': 4.6.6
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  '@xmldom/xmldom@0.8': 0.8.15
  '@xmldom/xmldom@0.9': 0.9.12

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # Slice 2 only uses Pi's local Faux provider; these transitive provider
  # packages do not need install scripts for the desktop runtime.
  '@google/genai': false
  protobufjs: false
